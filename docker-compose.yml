services:
  inventory-db:
    build: ./srcs/inventory-db
    image: inventory-db
    container_name: inventory-db
    restart: on-failure
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    expose:
      - "5432"
    volumes:
      - inventory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - crud-net

  billing-db:
    build: ./srcs/billing-db
    image: billing-db
    container_name: billing-db
    restart: on-failure
    environment:
      POSTGRES_USER: ${BILLING_DB_USER}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD}
      POSTGRES_DB: ${BILLING_DB_NAME}
    expose:
      - "5432"
    volumes:
      - billing-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - crud-net

  rabbit-queue:
    build: ./srcs/rabbit-queue
    image: rabbit-queue
    container_name: rabbit-queue
    hostname: rabbit-queue
    restart: on-failure
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - crud-net

  inventory-app:
    build: ./srcs/inventory-app
    image: inventory-app
    container_name: inventory-app
    restart: on-failure
    depends_on:
      inventory-db:
        condition: service_healthy
    environment:
      INVENTORY_DB_HOST: inventory-db
      INVENTORY_DB_PORT: "5432"
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      INVENTORY_APP_HOST: "0.0.0.0"
      INVENTORY_APP_PORT: "8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - crud-net

  billing-app:
    build: ./srcs/billing-app
    image: billing-app
    container_name: billing-app
    restart: on-failure
    depends_on:
      billing-db:
        condition: service_healthy
      rabbit-queue:
        condition: service_healthy
    environment:
      BILLING_DB_HOST: billing-db
      BILLING_DB_PORT: "5432"
      BILLING_DB_NAME: ${BILLING_DB_NAME}
      BILLING_DB_USER: ${BILLING_DB_USER}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD}
      RABBITMQ_HOST: rabbit-queue
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      BILLING_QUEUE: ${BILLING_QUEUE}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - crud-net

  api-gateway-app:
    build: ./srcs/api-gateway-app
    image: api-gateway-app
    container_name: api-gateway-app
    restart: on-failure
    depends_on:
      inventory-app:
        condition: service_healthy
      rabbit-queue:
        condition: service_healthy
    environment:
      GATEWAY_APP_HOST: "0.0.0.0"
      GATEWAY_APP_PORT: "3000"
      INVENTORY_API_URL: http://inventory-app:8080
      RABBITMQ_HOST: rabbit-queue
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      BILLING_QUEUE: ${BILLING_QUEUE}
    ports:
      - "3000:3000"
    volumes:
      - api-gateway-app:/var/log/api-gateway-app
    healthcheck:
      test: ["CMD", "/venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - crud-net

volumes:
  inventory-db:
    name: inventory-db
  billing-db:
    name: billing-db
  api-gateway-app:
    name: api-gateway-app

networks:
  crud-net:
    name: crud-net
    driver: bridge
